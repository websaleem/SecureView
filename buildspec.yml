version: 0.2

# The backend deploy is one script so that CI and a laptop do exactly the same
# thing. scripts/deploy-backend.sh packages both Lambdas under content-hashed S3
# keys and deploys the two stacks — secureview-api-<env> in ap-southeast-2 and
# secureview-edge-cdn-<env> in us-east-1 (Lambda@Edge and CLOUDFRONT-scope WAF
# exist only there).

phases:
  install:
    runtime-versions:
      python: 3.12

  pre_build:
    commands:
      - pip install --quiet boto3
      - aws --version

  build:
    commands:
      # CHANNEL is set on the CodeBuild project by infra/ci-cd.yaml, one pipeline
      # per channel. CODEBUILD_WEBHOOK_HEAD_REF, which this used to read, is only
      # populated for webhook-triggered builds and is always empty under
      # CodePipeline — so every run, including the production pipeline's,
      # resolved to dev. An unrecognised channel now stops the build instead.
      - |
        case "${CHANNEL:-}" in
          production) ENV=prod ;;
          beta)       ENV=dev ;;
          *) echo "FATAL: CHANNEL must be 'production' or 'beta' (got '${CHANNEL:-}')"; exit 1 ;;
        esac
      - echo "Deploying SecureView backend to $ENV (channel $CHANNEL)"
      - ./scripts/deploy-backend.sh "$ENV"

  post_build:
    commands:
      - echo "Backend deployment complete for $ENV"
