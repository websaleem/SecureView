version: 0.2

# The backend deploy is one script so that CI and a laptop do exactly the same
# thing. scripts/deploy-backend.sh packages both Lambdas under content-hashed S3
# keys and deploys the two stacks — secureview-api-<env> in ap-southeast-2 and
# secureview-edge-cdn-<env> in us-east-1 (Lambda@Edge and CLOUDFRONT-scope WAF
# exist only there).

phases:
  install:
    runtime-versions:
      python: 3.12

  pre_build:
    commands:
      - pip install --quiet boto3
      - aws --version

  build:
    commands:
      # main -> prod, everything else -> dev
      - BRANCH_NAME=$(echo $CODEBUILD_WEBHOOK_HEAD_REF | sed 's/refs\/heads\///')
      - if [ "$BRANCH_NAME" = "main" ]; then ENV="prod"; else ENV="dev"; fi
      - echo "Deploying SecureView backend to $ENV"
      - ./scripts/deploy-backend.sh "$ENV"

  post_build:
    commands:
      - echo "Backend deployment complete for $ENV"
