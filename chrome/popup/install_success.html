<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureView - Installation Successful</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      color: #fff;
      margin: 0;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .install-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .install-title {
      font-size: 32px;
      font-weight: 800;
      color: #4CAF50;
      margin-bottom: 12px;
    }
    .install-subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
    }
    .signup-container {
      background: rgba(255, 255, 255, 0.05);
      padding: 32px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 400px;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .subtitle {
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 24px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      color: white;
      box-sizing: border-box;
    }
    .radio-group {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 0;
    }
    .radio-group input[type="radio"] {
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #45a049;
    }
    .error {
      color: #ff5252;
      font-size: 12px;
      margin-top: 12px;
      display: none;
    }
    .success {
      color: #4CAF50;
      font-size: 14px;
      margin-top: 12px;
      display: none;
      text-align: center;
    }
    .hidden {
      display: none !important;
    }
    .login-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #4CAF50;
      text-decoration: none;
      font-size: 13px;
    }
    .login-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  
  <div class="install-header">
    <div class="install-title">Installation Successful! 🎉</div>
    <div class="install-subtitle">SecureView is now added to your browser. Create your account below to get started.</div>
  </div>

  <div class="signup-container">
    <div class="title">Create Account</div>
    <div class="subtitle">Join SecureView today</div>

    <div id="signup-form">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Jane Doe" />
      </div>

      <div class="form-group">
        <label>Account Type</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="accountType" value="Adult" checked>
            Adult
          </label>
          <label>
            <input type="radio" name="accountType" value="Child">
            Child
          </label>
        </div>
      </div>

      <div class="form-group hidden" id="parentNameGroup">
        <label for="parentName">Parent Full Name</label>
        <input type="text" id="parentName" placeholder="John Doe" />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="jane@example.com" />
      </div>

      <div class="form-group">
        <label for="password">Choose Password</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>

      <button id="signup-btn">Sign Up</button>
      <div class="error" id="error-msg"></div>
    </div>

    <div class="success hidden" id="success-msg">
      <p>Account created successfully!</p>
      <p>Please check your email for a verification code.</p>
    </div>

    <div id="verify-form" class="hidden">
      <div class="form-group">
        <label for="verifyCode">Verification Code</label>
        <input type="text" id="verifyCode" placeholder="123456" />
      </div>
      <button id="verify-btn">Verify Account</button>
      <div class="error" id="verify-error-msg"></div>
    </div>

    <a href="login.html" class="login-link">Already have an account? Log in</a>
  </div>
  <script src="signup.bundle.js"></script>
</body>
</html>
