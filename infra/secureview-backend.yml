AWSTemplateFormatVersion: '2010-09-09'
Description: SecureView backend stack — CloudFront, WAF, Lambda@Edge, API Gateway, Bedrock Lambda.

# NOTE: the Cognito user pool, client, and domain that used to live here were
# removed along with the extension's login flow. Deleting them from this
# template means the next deploy destroys the pool and every account in it.
#
# NOTE: Lambda@Edge functions must be created in us-east-1. Deploy this stack
# there, or split the edge function into its own us-east-1 stack.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment (dev or prod)

  ApiStageName:
    Type: String
    Default: live
    Description: >-
      API Gateway stage name. Also used as the CloudFront origin's OriginPath,
      which the edge function reads off the event when signing — so this can be
      changed here without touching the function code.

Resources:
  # ───────── WAFv2 WebACL (Global for CloudFront) ─────────
  # /categorize is unauthenticated, so this rate limit is the only thing
  # standing between a discovered endpoint and an unbounded Bedrock bill. It was
  # previously commented out in full, which left the resource with no Type and
  # made the whole template fail to deploy.
  SecureViewWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "SecureView-RateLimit-Global-${Environment}"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "SecureViewWAFGlobal${Environment}"
        SampledRequestsEnabled: true
      Rules:
        - Name: RateLimitByIP
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 100
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitRule
            SampledRequestsEnabled: true

  # ───────── Lambda@Edge IAM Role ─────────
  SecureViewEdgeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: 
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: SecureViewEdgeLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*

  # ───────── Lambda@Edge Function ─────────
  SecureViewEdgeLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "svSignedCategorizeRequest-${Environment}"
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Role: !GetAtt SecureViewEdgeLambdaRole.Arn
      Timeout: 5
      MemorySize: 128
      Code:
        # Code is managed in backend/lambda/lambda_function.py
        ZipFile: |
          def lambda_handler(event, context):
              pass

  # ───────── Lambda Version (Required for CloudFront attachment) ─────────
  SecureViewEdgeLambdaVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref SecureViewEdgeLambda
      Description: Lambda Edge for SecureView request routing

  # ───────── Bedrock Lambda IAM Role ─────────
  SecureViewBedrockLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: SecureViewBedrockLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Sid: Bedrock
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                # Scoped to the Nova Pro inference profile and the foundation
                # models it fans out to, rather than every model in the account.
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.amazon.nova-pro-v1:0"
                  - !Sub "arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0"

  # ───────── Bedrock Lambda Function ─────────
  SecureViewBedrockLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "svCategorizeURL-${Environment}"
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Role: !GetAtt SecureViewBedrockLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        # Code is managed in backend/lambda/bedrock/lambda_function.py
        ZipFile: |
          def lambda_handler(event, context):
              pass

  # Bounded retention: these logs are on the path that handles browsing data.
  SecureViewBedrockLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/svCategorizeURL-${Environment}"
      RetentionInDays: 14

  SecureViewBedrockLambdaVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref SecureViewBedrockLambda

  SecureViewBedrockLambdaProdAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref SecureViewBedrockLambda
      FunctionVersion: !GetAtt SecureViewBedrockLambdaVersion.Version
      Name: prod

  SecureViewBedrockLambdaBetaAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref SecureViewBedrockLambda
      FunctionVersion: !GetAtt SecureViewBedrockLambdaVersion.Version
      Name: beta

  # ───────── API Gateway (REST API) ─────────
  SecureViewApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "SecureViewCategorizationAPI-${Environment}"
      EndpointConfiguration:
        Types:
          - REGIONAL

  SecureViewApiGatewayResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SecureViewApiGateway
      ParentId: !GetAtt SecureViewApiGateway.RootResourceId
      PathPart: categorize

  SecureViewApiGatewayMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SecureViewApiGateway
      ResourceId: !Ref SecureViewApiGatewayResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SecureViewBedrockLambda.Arn}/invocations"

  # ───────── API Gateway Deployment / Stage ─────────
  SecureViewApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - SecureViewApiGatewayMethod
    Properties:
      RestApiId: !Ref SecureViewApiGateway

  SecureViewApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref SecureViewApiGateway
      DeploymentId: !Ref SecureViewApiGatewayDeployment
      StageName: !Ref ApiStageName
      MethodSettings:
        - HttpMethod: "*"
          ResourcePath: "/*"
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5

  # ───────── Lambda Permissions for API Gateway ─────────
  SecureViewBedrockLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt SecureViewBedrockLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SecureViewApiGateway}/*/POST/categorize"

  # ───────── CloudFront Distribution ─────────
  # ⚠ Production drift — read before deploying.
  #
  # The distribution the extension actually calls (d1pjkjoqck0lva.cloudfront.net,
  # E13N2TZOSX24F7) belongs to the older `secureview-backend-dev` stack, not to
  # the `SecureViewBackend-${Environment}` stack this template deploys. It also
  # serves the marketing site from S3, so it carries an ordered cache behaviour
  # for `*` that this template does not model.
  #
  # That ordered `*` behaviour allows only GET and HEAD, and CloudFront matches
  # ordered behaviours BEFORE the default one — so every POST to /categorize is
  # rejected at the edge with
  #   "This distribution is not configured to allow the HTTP request method..."
  # and the Lambda@Edge below never runs. That is why AI categorisation is dead
  # on that distribution.
  #
  # The explicit /categorize behaviour below is what keeps the API path ahead of
  # any catch-all. Any distribution that fronts both the site and this API needs
  # it.
  SecureViewDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "SecureView AI Categorization API - ${Environment}"
        WebACLId: !GetAtt SecureViewWebACL.Arn
        Origins:
          - Id: SecureViewApiGatewayOrigin
            DomainName: !Sub "${SecureViewApiGateway}.execute-api.${AWS::Region}.amazonaws.com"
            # CloudFront prepends this to the request URI on the way to the
            # origin. The edge function reads it off the event so it signs the
            # same path API Gateway will see.
            OriginPath: !Sub "/${ApiStageName}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPPort: 80
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: SecureViewApiGatewayOrigin
          ViewerProtocolPolicy: https-only
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          LambdaFunctionAssociations:
            - EventType: origin-request
              LambdaFunctionARN: !Ref SecureViewEdgeLambdaVersion
              IncludeBody: true
        CacheBehaviors:
          # Ordered behaviours are evaluated before DefaultCacheBehavior, so the
          # API paths must appear here to survive alongside any `*` behaviour.
          - PathPattern: /categorize
            TargetOriginId: SecureViewApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            LambdaFunctionAssociations:
              - EventType: origin-request
                LambdaFunctionARN: !Ref SecureViewEdgeLambdaVersion
                IncludeBody: true

Outputs:
  DistributionDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt SecureViewDistribution.DomainName

  CategorizeEndpoint:
    Description: Endpoint the extension calls (set as _CF_HOST in chrome/shared/config.js)
    Value: !Sub "https://${SecureViewDistribution.DomainName}/categorize"
