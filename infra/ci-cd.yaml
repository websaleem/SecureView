AWSTemplateFormatVersion: '2010-09-09'
Description: CI/CD Pipeline for SecureView Chrome Extension using AWS CodePipeline and CodeConnections

Parameters:
  FullRepositoryId:
    Type: String
    Description: GitHub Repository ID (e.g., your-org/SecureView)
  BranchName:
    Type: String
    Default: main
    Description: The branch to build and deploy
  CodeConnectionArn:
    Type: String
    Description: ARN of the AWS CodeConnection (created in AWS Console)
  NotificationEmail:
    Type: String
    Description: Email address for build notifications
  Channel:
    Type: String
    Default: beta
    AllowedValues:
      - beta
      - production
    Description: The release channel (beta or production)
    
Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource: 
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/secureview/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub "${ArtifactsBucket.Arn}/*"
              # buildspec.yml runs `cloudformation deploy`, updates and publishes
              # the Lambdas, and repoints the CloudFront edge association. None
              # of that was permitted before — every build command failed with
              # AccessDenied.
              # The backend is two stacks in two regions, so these cannot be
              # pinned to ${AWS::Region}: the edge/CDN stack is always us-east-1.
              - Sid: DeployStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/secureview-api-*/*"
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/secureview-edge-cdn-*/*"
                  - "arn:aws:cloudformation:*:aws:transform/*"
              # Lambda artifacts. The deploy script creates these buckets on
              # first run and uploads content-hashed zips.
              - Sid: LambdaArtifacts
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::secureview-artifacts-${AWS::AccountId}-*"
                  - !Sub "arn:aws:s3:::secureview-artifacts-${AWS::AccountId}-*/*"
              # cloudformation deploy creates the IAM roles, Lambdas, API
              # Gateway, WAF and CloudFront resources declared in the template,
              # and must be able to hand the execution roles to Lambda.
              # Scoped to secureview-* resources. This account also hosts
              # SecureBin, ShopShare, FloraSense, SkillView and Quizzee; a
              # wildcard here would let a compromised build reach all of them.
              - Sid: ManageLambdas
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PublishVersion
                  - lambda:ListVersionsByFunction
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                Resource:
                  - !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:secureview-*"
              - Sid: ManageRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:TagRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/secureview-*"
              - Sid: ManageLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                Resource:
                  - !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/secureview-*"
              # API Gateway, CloudFront and WAFv2 either do not support
              # resource-level permissions for the create/list calls
              # CloudFormation makes, or address resources by opaque generated
              # id that cannot be predicted in a policy. Kept separate and
              # explicit rather than hidden inside a blanket wildcard.
              - Sid: ManageApiCdnWaf
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:ListDistributions
                  - cloudfront:TagResource
                  - wafv2:CreateWebACL
                  - wafv2:UpdateWebACL
                  - wafv2:DeleteWebACL
                  - wafv2:GetWebACL
                  - wafv2:ListWebACLs
                  - wafv2:AssociateWebACL
                  - wafv2:TagResource
                Resource: '*'
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource: 
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub "${ArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: '*'
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref CodeConnectionArn

  SecureViewBackendProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "SecureView-Backend-${Channel}"
      Description: Builds and Deploys the SecureView AWS Backend
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: PYTHON_VERSION
            Value: '3.12'
          - Name: CHANNEL
            Value: !Ref Channel
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml

  SecureViewBackendPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      PipelineType: V2
      Name: !Sub "SecureView-Backend-Pipeline-${Channel}"
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: SourceAction
            Push:
              - FilePaths:
                  Includes:
                    - "backend/**"
                    - "infra/**"
                    - "buildspec.yml"
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              OutputArtifacts:
                - Name: SourceArtifact
              Configuration:
                ConnectionArn: !Ref CodeConnectionArn
                FullRepositoryId: !Ref FullRepositoryId
                BranchName: !Ref BranchName
        - Name: Deploy
          Actions:
            - Name: DeployAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceArtifact
              Configuration:
                ProjectName: !Ref SecureViewBackendProject

  BuildNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "SecureViewPipelineNotifications-${Channel}"

  BuildNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref BuildNotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  PipelineEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "SecureViewPipelineStatusRule-${Channel}"
      Description: Notify on CodePipeline state changes for SecureView
      EventPattern:
        source:
          - aws.codepipeline
        detail-type:
          - CodePipeline Pipeline Execution State Change
        detail:
          pipeline:
            - !Ref SecureViewBackendPipeline
          state:
            - SUCCEEDED
            - FAILED
      Targets:
        - Arn: !Ref BuildNotificationTopic
          Id: TargetFunctionV1

  EventRuleTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref BuildNotificationTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref BuildNotificationTopic

Outputs:
  PipelineUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${SecureViewBackendPipeline}/view"
