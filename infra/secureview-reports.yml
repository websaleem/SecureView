AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SecureView email reports — subscriber table, relay Lambda, and the
  CloudFront-signed Function URL it is reached through. Region: ap-southeast-2.

# ─────────────────────────────────────────────────────────────────────────────
# A SEPARATE STACK FROM secureview-api, deliberately.
#
# That stack is the classifier: API Gateway with AWS_IAM, reached through a
# Lambda@Edge function that signs each request. Reports cannot use that path
# without rewriting the signer, which is the most delicate component in the
# pipeline — it is versioned, it propagates on CloudFront's schedule, and it is
# what makes categorisation work at all. Its validation is specific to the
# classifier: POST only, and a JSON body carrying a `hostname`. Reports need GET
# for the confirmation and unsubscribe links, and a different body shape.
#
# This WAS built on a Lambda Function URL with CloudFront Origin Access Control,
# so that nothing had to touch the signer. That does not work, and the reason is
# worth keeping: OAC does not sign the request BODY for a Lambda function URL.
# Measured against dev — an empty-body POST reached the handler, a POST of "{}"
# came back 403 signature mismatch. A report is a body, so the path was a dead
# end regardless of how the Lambda was written.
#
# So reports go through API Gateway with AWS_IAM, reached through the same
# Lambda@Edge signer as the classifier, which signs bodies. The signer now has
# an explicit allowlist of path-and-method pairs and three signing modes; see
# backend/lambda/lambda_function.py and test/test_edge_signer.py.
#
# Routes are attached to the API created by the secureview-api stack rather than
# a second API, so both share one origin, one stage and one signer association.
# ─────────────────────────────────────────────────────────────────────────────

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]

  ArtifactBucket:
    Type: String
    Description: S3 bucket holding the packaged Lambda zip.

  ReportArtifactKey:
    Type: String
    Description: S3 key of the report Lambda package (content-addressed).

  ApiId:
    Type: String
    Description: >-
      The REST API created by the secureview-api stack. Report routes are added
      to it so they share its stage and its Lambda@Edge signer association.

  ApiRootResourceId:
    Type: String
    Description: Root resource id of that API.

  ReportSender:
    Type: String
    Default: SecureView <verify@secureview.websaleem.com>
    Description: >-
      From address. Send-only: nothing reads replies, and both emails say so.
      The domain must be a verified SES identity in this region.

  SiteBaseUrl:
    Type: String
    Description: >-
      Origin the confirmation and unsubscribe links point at, e.g.
      https://dev.secureview.websaleem.com. Must be the environment the user is
      actually running, or the link in their mail lands on the wrong site.

  LogRetentionDays:
    Type: Number
    Default: 30

Resources:
  # ───────── Subscribers ─────────
  # One row per address. Report contents are never stored — composed, sent,
  # dropped. What persists is the address, whether it was confirmed, the
  # install's client secret, and the last window sent per frequency.
  SubscribersTable:
    Type: AWS::DynamoDB::Table
    # Retained: this table is the record of who consented. Losing it would mean
    # silently re-mailing people who had unsubscribed, or dropping subscriptions
    # with no way to tell which.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "secureview-report-subscribers-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      # Unconfirmed rows carry a ttl and expire; confirming removes it, so a
      # confirmed subscription never disappears on its own.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/secureview-report-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  ReportRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "secureview-report-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: report-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/secureview-report-${Environment}:*"
              - Sid: Subscribers
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !GetAtt SubscribersTable.Arn
              # Scoped to the one identity, so a bug here cannot send as any
              # other verified domain in the account. FromAddress is pinned too:
              # ses:FromAddress restricts which sender the role may use even
              # within that identity.
              - Sid: SendAsSecureView
                Effect: Allow
                Action:
                  - ses:SendEmail
                Resource:
                  # Both the parent domain identity and the subdomain. Only
                  # websaleem.com is verified in SES, and that verification
                  # covers its subdomains — confirmed by sending from
                  # verify@secureview.websaleem.com before making this change.
                  # The subdomain ARN is listed as well because which identity
                  # IAM evaluates for a subdomain send is not worth guessing at,
                  # and listing both costs nothing: the grant is still two named
                  # identities rather than a wildcard.
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/websaleem.com"
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/secureview.websaleem.com"
                Condition:
                  StringEquals:
                    # Pinned, so a bug here cannot send as any other address on
                    # a domain this account controls. It also means changing the
                    # sender fails loudly rather than silently sending as the
                    # old one.
                    "ses:FromAddress": "verify@secureview.websaleem.com"

  ReportFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReportLogGroup
    Properties:
      FunctionName: !Sub "secureview-report-${Environment}"
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Role: !GetAtt ReportRole.Arn
      Timeout: 20
      MemorySize: 256
      Architectures: [x86_64]
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ReportArtifactKey
      Environment:
        Variables:
          SUBSCRIBERS_TABLE: !Ref SubscribersTable
          REPORT_SENDER: !Ref ReportSender
          SITE_BASE_URL: !Ref SiteBaseUrl

  # ───────── API Gateway routes ─────────
  # Added to the classifier's API (passed in as ApiId) so reports share its
  # stage, its origin and its signer association. A second API would mean a
  # second origin and a second behaviour for no benefit.
  ReportResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiId
      ParentId: !Ref ApiRootResourceId
      PathPart: report

  # One resource per route rather than a {proxy+}: the signer only signs the
  # five paths it knows, so a proxy would accept nothing extra, and naming them
  # here keeps the deployable surface identical to the signed surface.
  ReportRouteResources:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiId
      ParentId: !Ref ReportResource
      PathPart: "{action}"

  ReportMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiId
      ResourceId: !Ref ReportRouteResources
      # ANY: subscribe/status/send are POST, confirm/unsubscribe are GET. Which
      # methods are actually permitted is decided by the signer's allowlist —
      # an unsigned request never reaches here at all.
      HttpMethod: ANY
      AuthorizationType: AWS_IAM
      RequestParameters:
        "method.request.path.action": true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ReportFunction.Arn}/invocations"

  ReportInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ReportFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/report/*"

  # NO Deployment RESOURCE HERE, deliberately.
  #
  # A method added to an existing API does not reach traffic until the stage is
  # redeployed, and the stage belongs to the secureview-api stack. Creating a
  # Deployment here would succeed and change nothing: the stage would keep
  # serving the deployment it already points at, and the routes would 403 or 404
  # with the stack reporting success. scripts/deploy-reports.sh calls
  # `apigateway create-deployment --stage-name` after this stack converges,
  # which is the step that actually publishes them.

Outputs:
  ReportFunctionName:
    Value: !Ref ReportFunction
  SubscribersTableName:
    Value: !Ref SubscribersTable
