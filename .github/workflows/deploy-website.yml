name: Deploy Website

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'website/**'
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: read the repository, and mint the OIDC
# token that AWS exchanges for short-lived deployment credentials.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # OIDC rather than a stored access key: GitHub presents a short-lived
      # token, AWS exchanges it for credentials that expire with the job, so
      # there is no long-lived secret to leak or rotate. The role is shared by
      # every websaleem project and reaches the site buckets only.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: secureview-deploy-${{ github.run_id }}
          aws-region: ap-southeast-2

      - name: Deploy Website to S3 and Invalidate CloudFront
        env:
          PROD_DIST_ID: ${{ secrets.SECUREVIEW_PROD_CF_DIST_ID }}
          DEV_DIST_ID: ${{ secrets.SECUREVIEW_DEV_CF_DIST_ID }}
          # The beta listing's id, so the dev site links to the beta extension
          # rather than sending testers to install production. Same secret the
          # release workflow already uses to upload the beta zip, so there is
          # one source of truth for which listing "beta" means.
          PROD_EXTENSION_ID: ojhmodiiehcingcnhlglenenoemmegim
          BETA_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID_BETA }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            BUCKET="secureview.websaleem.com"
            DIST_ID="$PROD_DIST_ID"
            echo "=== Deploying to PRODUCTION ($BUCKET) ==="
          else
            BUCKET="dev.secureview.websaleem.com"
            DIST_ID="$DEV_DIST_ID"
            echo "=== Deploying to DEVELOPMENT ($BUCKET) ==="
            # Inject dev URLs for the dev website
            find website -type f -name "*.html" -exec sed -i 's|https://secureview.websaleem.com|https://dev.secureview.websaleem.com|g' {} +

            # And point the store links at the BETA listing.
            #
            # Without this the dev site's "Add to Chrome", uninstall and support
            # links all carried the production extension id, so anyone testing
            # from the dev site installed the live extension instead of the beta
            # they were there to try — and the uninstall-feedback page offered to
            # reinstall production too.
            #
            # Hard failure rather than a best-effort rewrite: an empty secret
            # would sed these into ".../detail/" and produce dead links on every
            # page, which is worse than not deploying.
            if [ -z "$BETA_EXTENSION_ID" ]; then
              echo "FATAL: CWS_EXTENSION_ID_BETA is not set — refusing to deploy dev with production store links" >&2
              exit 1
            fi
            find website -type f -name "*.html" -exec \
              sed -i "s|chromewebstore.google.com/detail/$PROD_EXTENSION_ID|chromewebstore.google.com/detail/$BETA_EXTENSION_ID|g" {} +

            # Positive check, not a hopeful one: assert the production id is gone
            # from what is about to be uploaded.
            if grep -rl "detail/$PROD_EXTENSION_ID" website/ >/dev/null 2>&1; then
              echo "FATAL: production extension id still present after rewrite:" >&2
              grep -rln "detail/$PROD_EXTENSION_ID" website/ >&2
              exit 1
            fi
            echo "Store links rewritten to the beta listing."
          fi
          
          # Sync and capture output to stderr (so we still see it in logs) and a variable
          SYNC_OUTPUT=$(aws s3 sync website/ s3://$BUCKET/ --delete | tee /dev/stderr)
          
          # Extract exactly what files were modified/uploaded/deleted
          PATHS=$(echo "$SYNC_OUTPUT" | grep -oE "s3://$BUCKET/[^ ]+" | sed "s|s3://$BUCKET||g")
          
          if [ -z "$PATHS" ]; then
            echo "No files changed. Skipping CloudFront invalidation."
          else
            # Convert paths to space-separated list
            PATHS_SPACED=$(echo "$PATHS" | tr '\n' ' ')
            echo "Invalidating paths: $PATHS_SPACED"
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths $PATHS_SPACED
          fi

