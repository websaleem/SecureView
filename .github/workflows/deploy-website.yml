name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to dev.secureview.websaleem.com
        run: |
          echo "Deploying website to dev.secureview.websaleem.com..."
          
          # Sync and capture output to stderr (so we still see it in logs) and a variable
          SYNC_OUTPUT=$(aws s3 sync website/ s3://dev.secureview.websaleem.com/ --delete | tee /dev/stderr)
          
          # Extract exactly what files were modified/uploaded/deleted
          PATHS=$(echo "$SYNC_OUTPUT" | grep -oE "s3://dev.secureview.websaleem.com/[^ ]+" | sed "s|s3://dev.secureview.websaleem.com||g")
          
          if [ -z "$PATHS" ]; then
            echo "No files changed. Skipping CloudFront invalidation."
          else
            # Convert paths to space-separated list
            PATHS_SPACED=$(echo "$PATHS" | tr '\n' ' ')
            echo "Invalidating paths: $PATHS_SPACED"
            aws cloudfront create-invalidation --distribution-id SECUREVIEW_DEV_CF_DIST_ID --paths $PATHS_SPACED
          fi

