name: Deploy Chrome Extension

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'chrome/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build zip
        env:
          CHANNEL: ${{ github.ref_name == 'main' && 'production' || 'beta' }}
          PROD_COGNITO_CLIENT_ID: ${{ secrets.PROD_COGNITO_CLIENT_ID }}
          PROD_COGNITO_DOMAIN:    ${{ secrets.PROD_COGNITO_DOMAIN }}
          PROD_CLOUDFRONT_URL:    ${{ secrets.PROD_CLOUDFRONT_URL }}
        run: ./scripts/build-zip.sh

      - name: Upload + publish to Chrome Web Store
        env:
          CWS_CLIENT_ID:     ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID:  ${{ github.ref_name == 'main' && secrets.CWS_EXTENSION_ID || secrets.CWS_EXTENSION_ID_BETA }}
        run: |
          ZIP=$(ls SecureView*.zip | head -1)
          test -f "$ZIP" || { echo "no zip produced"; exit 1; }
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "$ZIP" \
            --extension-id  "$CWS_EXTENSION_ID" \
            --client-id     "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" \
            --refresh-token "$CWS_REFRESH_TOKEN" \
            --auto-publish

      - uses: actions/upload-artifact@v4
        with:
          name: SecureView-${{ github.ref_name }}
          path: SecureView*.zip
          retention-days: 90

